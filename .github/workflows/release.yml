name: Release

# Push a tag like v1.1.0 and this builds Windows + macOS artifacts and publishes them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel --target PS5DirectView InputTests CryptoTests FrameGenerationTests

      - name: Test
        shell: pwsh
        run: |
          build\Release\InputTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          build\Release\CryptoTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          build\Release\FrameGenerationTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $name = "PS5DirectView-${{ env.RELEASE_TAG }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item build\Release\PS5DirectView.exe, README.md, LICENSE, FRAME-GENERATION.md $name
          Copy-Item third_party\README.md "$name\THIRD_PARTY.md"
          Copy-Item test-1080p60.mp4 $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            PS5DirectView-${{ env.RELEASE_TAG }}-windows-x64.zip
            PS5DirectView-${{ env.RELEASE_TAG }}-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build app
        run: cmake --build build --parallel

      - name: Build tests
        run: cmake --build build --target InputTests CryptoTests FrameGenerationTests --parallel

      - name: Input tests
        run: ./build/InputTests

      - name: Crypto tests
        run: ./build/CryptoTests

      - name: Frame generation cadence tests
        run: ./build/FrameGenerationTests

      - name: Package
        run: |
          name="PS5DirectView-${{ env.RELEASE_TAG }}-macos-universal"
          mkdir -p "$name"
          /usr/bin/ditto "build/PS5DirectView.app" "$name/PS5DirectView.app"
          cp README.md LICENSE FRAME-GENERATION.md "$name/"
          cp third_party/README.md "$name/THIRD_PARTY.md"
          cp test-1080p60.mp4 "$name/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$name" "$name.zip"
          shasum -a 256 "$name.zip" | awk '{print $1"  "$2}' > "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            PS5DirectView-${{ env.RELEASE_TAG }}-macos-universal.zip
            PS5DirectView-${{ env.RELEASE_TAG }}-macos-universal.zip.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos-release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" --notes-file RELEASE-NOTES-v1.3.0.md
          fi
