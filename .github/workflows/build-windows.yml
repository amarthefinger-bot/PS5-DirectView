name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build app
        run: cmake --build build --config Release --parallel

      - name: Build tests
        run: cmake --build build --config Release --target InputTests CryptoTests --parallel

      - name: Input tests
        run: build\Release\InputTests.exe

      - name: Crypto tests
        run: build\Release\CryptoTests.exe

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: PS5DirectView-windows-x64
          path: build/Release/PS5DirectView.exe
          if-no-files-found: error
